[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codesignbench"
version = "0.1.0"
description = "Data preparation and evaluation tools for Co-Design Bench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cdb = "codesignbench.__main__:main"

[tool.setuptools.packages.find]
include = ["codesignbench*"]

[tool.setuptools.package-data]
codesignbench = ["resources/*.txt"]
